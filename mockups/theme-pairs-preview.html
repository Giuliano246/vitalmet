<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pares de tema — Día + Noche</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:#0a0a0a;padding:28px 18px;color:#e8e6e0}
.mono{font-family:'IBM Plex Mono',monospace}
h1{font-size:18px;font-weight:500;text-align:center;margin-bottom:6px;color:#e8a030;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em}
.sub{text-align:center;font-size:12px;color:#9a9890;margin-bottom:26px;font-family:'IBM Plex Mono',monospace}
.pairs{display:flex;flex-direction:column;gap:22px;max-width:1280px;margin:0 auto}
.pair{border:2px solid #2a2a2a;border-radius:12px;overflow:hidden}
.pair-head{padding:11px 16px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:#fff;display:flex;justify-content:space-between;align-items:center}
.pair-head .tag{font-size:10px;opacity:.85;font-weight:400}
.pair-body{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:860px){.pair-body{grid-template-columns:1fr}}
.half{position:relative}
.half+.half{border-left:1px solid #000}
.mode-tag{position:absolute;top:8px;right:10px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;z-index:2}
.app{display:flex;height:340px;font-size:12px}
.sidebar{width:130px;flex-shrink:0;display:flex;flex-direction:column}
.logo{padding:10px 11px;border-bottom:1px solid var(--border)}
.logo-t{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.04em}
.logo-s{font-size:9px;margin-top:2px}
.nav{padding:6px 0;flex:1}
.nav-sec{font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:7px 11px 3px}
.nav-i{display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:11px;border-left:2px solid transparent}
.nav-i.active{border-left-color:var(--accent);font-weight:500}
.nav-dot{width:4px;height:4px;border-radius:50%;background:currentColor}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.ph{padding:11px 13px 0;border-bottom:1px solid var(--border)}
.ph-t{font-size:13px;font-weight:500}
.ph-s{font-size:9px;font-family:'IBM Plex Mono',monospace;margin:2px 0 8px}
.body2{padding:11px 13px;flex:1;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.stat{border:1px solid var(--border);border-radius:5px;padding:6px 8px}
.stat-l{font-size:7px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.stat-v{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500}
.toolbar{display:flex;gap:5px;margin-bottom:8px}
.search{flex:1;border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:10px}
.btn{padding:4px 9px;border-radius:4px;font-size:10px;font-weight:500;border:1px solid;white-space:nowrap}
.btn-gh{background:transparent;border-color:var(--border2)}
.tw{border:1px solid var(--border);border-radius:5px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:5px 8px;text-align:left;font-size:8px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:5px 8px;font-size:10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:8px;font-family:'IBM Plex Mono',monospace;font-weight:500}
.swatches{display:flex;gap:3px;padding:8px 13px;border-top:1px solid var(--border)}
.sw{width:18px;height:18px;border-radius:3px;border:1px solid rgba(128,128,128,.25)}
</style>
</head>
<body>
<h1>PARES DE TEMA — Día + Noche</h1>
<div class="sub">// cada par combina entre sí · pensados para metalúrgica · acento legible (texto ≥4.5:1)</div>
<div class="pairs" id="pairs"></div>

<script>
const PAIRS=[
 {name:'P1 · Madera', tag:'perla + nogal / carbón + ámbar miel', head:'#8b5e34',
  day:{bg:'#f6f1e8',surface:'#fffefb',surface2:'#ede5d6',border:'#e0d7c4',border2:'#cabb9e',accent:'#8b5e34',onAccent:'#fff',green:'#2f7d57',blue:'#36678f',text:'#2a241c',text2:'#5c5141',text3:'#6f6552'},
  night:{bg:'#100e0b',surface:'#1b1814',surface2:'#262019',border:'#352d23',border2:'#463c2e',accent:'#e3a142',onAccent:'#1b1814',green:'#5aaa78',blue:'#5a9ec9',text:'#ece7dd',text2:'#a39a89',text3:'#8a8073'}},

 {name:'P2 · Acero', tag:'blanco frío + azul acero / carbón azulado', head:'#2f6fae',
  day:{bg:'#f3f5f8',surface:'#ffffff',surface2:'#e9edf3',border:'#d9e0ea',border2:'#bcc6d4',accent:'#2f6fae',onAccent:'#fff',green:'#2f8f6a',blue:'#2f6fae',text:'#16202b',text2:'#45525f',text3:'#647281'},
  night:{bg:'#0d1014',surface:'#161b22',surface2:'#1e252e',border:'#2c333d',border2:'#3b4450',accent:'#5aa6e0',onAccent:'#0d1014',green:'#5cb98e',blue:'#5aa6e0',text:'#e6ebf1',text2:'#98a4b2',text3:'#74808f'}},

 {name:'P3 · Cobre', tag:'crema + cobre / negro cálido + cobre brillante', head:'#a55f33',
  day:{bg:'#f6f3ef',surface:'#fffdfa',surface2:'#ece5dd',border:'#ddd3c7',border2:'#c6b8a6',accent:'#a55f33',onAccent:'#fff',green:'#3a8560',blue:'#3a6f93',text:'#271f1a',text2:'#594d44',text3:'#6d6056'},
  night:{bg:'#100d0b',surface:'#1a1613',surface2:'#241e1a',border:'#332a23',border2:'#453a30',accent:'#d98c52',onAccent:'#1a1613',green:'#5aa87f',blue:'#5a93c0',text:'#ece5dd',text2:'#a59689',text3:'#877a6d'}},

 {name:'P4 · Petróleo', tag:'blanco + verde petróleo / negro petróleo + teal',  head:'#0f7d6e',
  day:{bg:'#f1f5f4',surface:'#ffffff',surface2:'#e6efed',border:'#d4e2df',border2:'#b6c9c5',accent:'#0f7d6e',onAccent:'#fff',green:'#0f7d6e',blue:'#2f7ab8',text:'#122420',text2:'#41524e',text3:'#5f716c'},
  night:{bg:'#0a1110',surface:'#121a18',surface2:'#1a2522',border:'#28332f',border2:'#374842',accent:'#2cc0a8',onAccent:'#0a1110',green:'#2cc0a8',blue:'#5aa6d8',text:'#e2ebe8',text2:'#93a5a0',text3:'#708079'}},
];

function hexToRgba(h,a){const n=h.replace('#','');const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}

function mock(p, modeLabel, isDay){
  const tagBg=isDay?'rgba(0,0,0,.06)':'rgba(255,255,255,.08)';
  return `
  <div class="half">
    <span class="mode-tag" style="background:${tagBg};color:${p.text3}">${modeLabel}</span>
    <div class="app" style="--bg:${p.bg};--surface:${p.surface};--surface2:${p.surface2};--border:${p.border};--border2:${p.border2};--accent:${p.accent};--green:${p.green};--blue:${p.blue};--text:${p.text};--text2:${p.text2};--text3:${p.text3};background:var(--bg);color:var(--text)">
      <div class="sidebar" style="background:var(--surface);border-right:1px solid var(--border)">
        <div class="logo"><div class="logo-t">VITALSTOCK</div><div class="logo-s" style="color:var(--text2)">Vitalmet SA</div></div>
        <div class="nav">
          <div class="nav-sec" style="color:var(--text3)">Operación</div>
          <div class="nav-i" style="color:var(--text2)"><span class="nav-dot"></span>Dashboard</div>
          <div class="nav-i active" style="color:var(--accent);background:${hexToRgba(p.accent,.10)}"><span class="nav-dot"></span>Compras</div>
          <div class="nav-i" style="color:var(--text2)"><span class="nav-dot"></span>Ventas</div>
          <div class="nav-i" style="color:var(--text2)"><span class="nav-dot"></span>Stock</div>
        </div>
      </div>
      <div class="main">
        <div class="ph"><div class="ph-t">Compras</div><div class="ph-s" style="color:var(--text3)">// órdenes de compra</div></div>
        <div class="body2">
          <div class="stats">
            <div class="stat" style="background:var(--surface)"><div class="stat-l" style="color:var(--text3)">OCs</div><div class="stat-v" style="color:var(--accent)">42</div></div>
            <div class="stat" style="background:var(--surface)"><div class="stat-l" style="color:var(--text3)">Pend.</div><div class="stat-v" style="color:var(--accent)">7</div></div>
            <div class="stat" style="background:var(--surface)"><div class="stat-l" style="color:var(--text3)">Recib.</div><div class="stat-v" style="color:var(--green)">35</div></div>
          </div>
          <div class="toolbar"><div class="search" style="background:var(--surface);color:var(--text3)">⌕ Buscar...</div><div class="btn" style="background:var(--accent);border-color:var(--accent);color:${p.onAccent}">+ Nueva</div></div>
          <div class="tw" style="background:var(--surface)">
            <table>
              <thead><tr style="background:var(--surface2)"><th style="color:var(--text3)">Nro</th><th style="color:var(--text3)">Prov.</th><th style="color:var(--text3)">Estado</th></tr></thead>
              <tbody>
                <tr><td class="mono" style="color:var(--text)">OC-42</td><td style="color:var(--text2)">Aceros</td><td><span class="badge" style="background:${hexToRgba(p.blue,.16)};color:var(--blue)">Confirm.</span></td></tr>
                <tr><td class="mono" style="color:var(--text)">OC-41</td><td style="color:var(--text2)">Insumos</td><td><span class="badge" style="background:${hexToRgba(p.green,.18)};color:var(--green)">Recib.</span></td></tr>
                <tr><td class="mono" style="color:var(--text)">OC-40</td><td style="color:var(--text2)">Aceros</td><td><span class="badge" style="background:${hexToRgba(p.accent,.18)};color:var(--accent)">Borr.</span></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="swatches" style="background:${p.surface};border-top:1px solid ${p.border}">
      ${[p.bg,p.surface,p.surface2,p.accent,p.green,p.text].map(c=>`<div class="sw" style="background:${c}"></div>`).join('')}
    </div>
  </div>`;
}

document.getElementById('pairs').innerHTML=PAIRS.map(p=>`
  <div class="pair">
    <div class="pair-head" style="background:${p.head}"><span>${p.name}</span><span class="tag">${p.tag}</span></div>
    <div class="pair-body">
      ${mock(p.day,'☀ Día',true)}
      ${mock(p.night,'☾ Noche',false)}
    </div>
  </div>`).join('');
</script>
</body>
</html>
