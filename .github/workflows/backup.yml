# Backup nocturno de la base de Supabase (contabilidad legal + facturas AFIP adentro).
# Independiente de los backups del proveedor: si Supabase pierde el proyecto, esto sobrevive.
#
# Requiere el secret SUPABASE_DB_URL en GitHub → Settings → Secrets → Actions:
#   Supabase Dashboard → Project Settings → Database → Connection string (URI),
#   usar la variante "Session pooler" (puerto 5432). Formato:
#   postgresql://postgres.dqvlqhaxgvtilhiuatpv:[PASSWORD]@aws-0-<region>.pooler.supabase.com:5432/postgres
#
# Los dumps quedan como artifacts del workflow (repo privado), retención 30 días.
# Restore: descargar el artifact y `pg_restore -d <db> vitalstock_YYYY-MM-DD.dump`
#
# Archivo permanente (tercera copia, fuera de Supabase y de GitHub): el día 1
# de cada mes, y cuando se corre a mano con una etiqueta (p. ej. el cierre de
# ejercicio), el dump se cifra con GPG (AES-256) y se sube a un bucket de
# Cloudflare R2. Sin estos secrets el paso se saltea y el backup diario sigue
# igual:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET,
#   BACKUP_PASSPHRASE (la clave del cifrado: sin ella la copia no se abre).
# Quedan en  mensual/vitalstock_AAAA-MM.dump.gpg  y  cierres/<etiqueta>_<fecha>.dump.gpg
# Restore: gpg --decrypt archivo.dump.gpg > archivo.dump  y después pg_restore.

name: backup-db

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 ART
  workflow_dispatch: # correrlo a mano desde la pestaña Actions
    inputs:
      etiqueta:
        description: "Guardar también en el archivo permanente con este nombre (ej.: cierre-2026). Vacío = sólo backup diario."
        required: false
        default: ""

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ETIQUETA: ${{ github.event.inputs.etiqueta }}
    steps:
      # El cliente de pg_dump debe ser >= versión del servidor (PostgreSQL 17).
      # Ubuntu trae el 16 por defecto: instalamos el 17 desde PGDG y lo
      # invocamos por ruta explícita (el symlink /usr/bin/pg_dump sigue
      # apuntando al viejo).
      - name: Instalar postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Falta el secret SUPABASE_DB_URL"; exit 1; }
          FECHA=$(date +%F)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner --no-privileges \
            --schema=public \
            --file="vitalstock_${FECHA}.dump"
          ls -lh vitalstock_*.dump

      - name: Verificar que el dump no está vacío
        run: |
          SIZE=$(stat -c%s vitalstock_*.dump)
          test "$SIZE" -gt 10000 || { echo "Dump sospechosamente chico ($SIZE bytes)"; exit 1; }

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitalstock-backup-${{ github.run_id }}
          path: vitalstock_*.dump
          retention-days: 30
          if-no-files-found: error

      - name: ¿Toca archivo permanente?
        id: archivo
        run: |
          DESTINO=""
          if [ -n "$ETIQUETA" ]; then
            DESTINO="cierres/$(echo "$ETIQUETA" | tr -c 'A-Za-z0-9_-' '-' | sed 's/-*$//')_$(date +%F).dump.gpg"
          elif [ "$(date +%d)" = "01" ]; then
            DESTINO="mensual/vitalstock_$(date +%Y-%m).dump.gpg"
          fi
          echo "destino=$DESTINO" >> "$GITHUB_OUTPUT"
          echo "Destino: ${DESTINO:-ninguno (sólo backup diario)}"

      - name: Cifrar y subir al archivo permanente (Cloudflare R2)
        if: steps.archivo.outputs.destino != '' && env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DESTINO: ${{ steps.archivo.outputs.destino }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta el secret BACKUP_PASSPHRASE"; exit 1; }
          DUMP=$(ls vitalstock_*.dump)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "$DUMP.gpg" "$DUMP"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$DUMP.gpg" "s3://${R2_BUCKET}/${DESTINO}" --endpoint-url "$ENDPOINT" --no-progress
          # Verificación: el objeto existe y pesa lo mismo que el archivo local
          REMOTO=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$DESTINO" --endpoint-url "$ENDPOINT" --query ContentLength --output text)
          LOCAL=$(stat -c%s "$DUMP.gpg")
          test "$REMOTO" = "$LOCAL" || { echo "Tamaño distinto: remoto $REMOTO vs local $LOCAL"; exit 1; }
          echo "Archivado: s3://${R2_BUCKET}/${DESTINO} ($LOCAL bytes)"

      - name: Aviso si tocaba archivar y no hay bucket configurado
        if: steps.archivo.outputs.destino != '' && env.R2_BUCKET == ''
        run: echo "::warning::Tocaba copia al archivo permanente pero faltan los secrets de R2 (ver comentario al inicio del workflow)."
